name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # latest 릴리스를 올리려면 필요하다
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: hangul 테스트
        run: ./gradlew :hangul:test

      - name: 서명 키 준비
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secrets가 아직 없어서 서명과 릴리스를 건너뛴다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: release APK 빌드
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :android:assembleRelease

      - name: 권한 검사
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          apk="$(ls android/build/outputs/apk/release/*.apk)"
          python3 .github/scripts/check_permissions.py "$aapt2" "$apk" android/permissions-allowed.txt io.github.bedcoding.hangulime

      - name: latest 릴리스 올리기
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/build/outputs/apk/release/android-release.apk hangul-ime.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest hangul-ime.apk --target "$GITHUB_SHA" --latest \
            --title "빌드 $GITHUB_RUN_NUMBER" --notes "커밋 ${GITHUB_SHA::7}"
