name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # latest 릴리스를 올리려면 필요하다
    steps:
      - uses: actions/checkout@v7
        with:
          # CI에서 git push는 하지 않는다. 쓰기 권한이 있는 토큰을 뒤 단계가 볼 수 있는 곳에 남기지 않는다.
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: hangul 테스트
        run: ./gradlew :hangul:test

      - name: 서명 키 준비
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secrets가 아직 없어서 서명, 가상 폰 확인, 릴리스를 건너뛴다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: release APK 빌드
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :android:assembleRelease

      # 서명이 끝나면 키스토어 파일을 바로 지운다. 뒤에 남이 만든 액션이 돈다.
      - name: 서명 키 지우기
        if: always() && steps.signing.outputs.enabled == 'true'
        run: rm -f "$SIGNING_KEYSTORE_FILE"

      - name: 권한 검사
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          apk="$(ls android/build/outputs/apk/release/*.apk)"
          python3 .github/scripts/check_permissions.py "$aapt2" "$apk" android/permissions-allowed.txt io.github.bedcoding.hangulime

      # 가상 폰(에뮬레이터)에 깔아서 폰에서 하던 확인을 대신한다. 서명된 APK만 깔 수 있어서 Secrets가 있을 때만 돈다.
      - name: 가상 폰 준비 (KVM)
        if: steps.signing.outputs.enabled == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 가상 폰 확인
        if: steps.signing.outputs.enabled == 'true'
        # v2.38.0. 남이 만든 액션이라 태그 대신 커밋으로 고정한다.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash .github/scripts/emulator_check.sh android/build/outputs/apk/release/android-release.apk emulator-check

      - name: 가상 폰 화면 올리기
        if: ${{ !cancelled() && steps.signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: emulator-check
          path: emulator-check/
          if-no-files-found: ignore
          retention-days: 14

      - name: latest 릴리스 올리기
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/build/outputs/apk/release/android-release.apk hangul-ime.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest hangul-ime.apk --target "$GITHUB_SHA" --latest \
            --title "빌드 $GITHUB_RUN_NUMBER" --notes "커밋 ${GITHUB_SHA::7}"
